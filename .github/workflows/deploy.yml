name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths: [ 'web/**', '.github/workflows/deploy.yml' ]
  workflow_dispatch:
  # 매일 07:30 KST(전날 22:30 UTC) — 신규 상장·폐지·사명 변경을 종목 검색 목록에 반영
  schedule:
    - cron: '30 22 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 한국투자증권 종목 마스터로 public/stocks.json 갱신 (실패하면 저장소에 있는 목록을 그대로 씀)
      - name: Update stock list
        run: python scripts/build_stocks.py
        continue-on-error: true
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # 빌드 결과물(web/dist)만 공개 — 저장소의 다른 파일은 배포되지 않음
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
